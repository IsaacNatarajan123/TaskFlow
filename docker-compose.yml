version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./app-backend
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./app-backend/.env
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./app-frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data: